global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # The game server exposes /metrics on 9464 (FO_METRICS_PORT). Add one target per server
  # process. For local testing, `npm run analytics-demo` in server/ serves fake data there.
  - job_name: fable-server
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels: { env: dev }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

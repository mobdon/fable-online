// Fable Online wire protocol (draft). Client sends inputs; server sends state.
// Today the server speaks these as JSON objects over a WebSocket at /play, one per text
// frame, with a "t" field naming the message (hello, input, chat, ping / welcome,
// enter_region, tick, chat_out, pong, error). Field names below are the JSON keys.
// See server/src/net/protocol.ts.
syntax = "proto3";
package fable_online;

// ---- client -> server --------------------------------------------------
// The only things a client can ever say. No positions, health, gold or items.
message Hello        { uint32 protocol = 1; string exe_timestamp = 2; string token = 3; } // token = one-time ticket from POST /launcher/v1/join
message InputFrame   { uint32 seq = 1; float move_x = 2; float move_y = 3; uint32 buttons = 4; float camera_yaw = 5; } // stick clamped to length 1, seq must increase
message Chat         { string text = 1; } // max 200 chars, 1/s burst 5
// Dev only: where the local game put this player's hero. The server ignores it unless it
// is started with FO_TRUST_CLIENT_POS, since a client-chosen position is a cheat.
message HeroPos      { float x = 1; float y = 2; float z = 3; float yaw = 4; uint32 area = 5; }
message Ping         { uint32 n = 1; }

// ---- server -> client --------------------------------------------------
message Welcome      { uint32 player_id = 1; uint32 region_uid = 2; string name = 3; string phase = 4; uint32 renown = 5; uint32 tick_rate = 6; }
message EnterRegion  { uint32 region_uid = 1; float x = 2; float y = 3; float z = 4; string region = 5; string channel = 6; }
// One entity in a region. `kind` is "hero" or "creature"; a creature carries the Fable def
// name the mod spawns a stand-in from, a hero carries the name and renown for its tag.
// Entities an entity-sync client stops being sent are gone: there is no removal list.
message EntityState  {
  uint32 id = 1; uint32 def_id = 2; float x = 3; float y = 4; float z = 5; float yaw = 6;
  uint32 anim = 7; float health = 8; string kind = 9; string def = 10; string name = 11; uint32 renown = 12;
}
// Only the entities within the server's interest radius of the receiving player.
message WorldTick    { uint32 tick = 1; uint32 last_input_seq = 2; repeated EntityState entities = 3; uint32 removed = 4; }
message ChatOut      { uint32 from = 1; string text = 2; string name = 3; }
message Pong         { uint32 n = 1; }
message Error        { string error = 1; string message = 2; }

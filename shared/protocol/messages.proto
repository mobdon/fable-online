// Fable Online wire protocol (draft). Client sends inputs; server sends state.
// Chat and name tags have their own line-based JSON protocol: see chat.md.
syntax = "proto3";
package fable_online;

// ---- client -> server --------------------------------------------------
message Hello        { uint32 protocol = 1; string exe_timestamp = 2; string token = 3; }
message InputFrame   { uint32 seq = 1; float move_x = 2; float move_y = 3; uint32 buttons = 4; float camera_yaw = 5; }

// ---- server -> client --------------------------------------------------
message Welcome      { uint32 player_id = 1; uint32 region_uid = 2; }
message EnterRegion  { uint32 region_uid = 1; float x = 2; float y = 3; float z = 4; }
message EntityState  { uint32 id = 1; uint32 def_id = 2; float x = 3; float y = 4; float z = 5; float yaw = 6; uint32 anim = 7; float health = 8; }
message WorldTick    { uint32 tick = 1; uint32 last_input_seq = 2; repeated EntityState entities = 3; uint32 removed = 4; }
